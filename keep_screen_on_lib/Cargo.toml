[package]
name = "keep_screen_on_lib"
description = "A library for toggling screen locking timer on and off"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"

[target.x86_64-unknown-linux-gnu.dependencies]
zbus = "6.2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32", "Win32_System", "Win32_System_Power"] }
