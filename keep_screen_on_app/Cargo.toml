[package]
name = "keep_screen_on"
description = "An application, which keeps your screen active for as long as you wish"
version = "1.0.0"
edition = "2024"
license = "MIT"

[package.metadata.bundle]
name = "Keep Screen On"
identifier = "keep_screen_on"
appimage_metainfo_path = "assets/keep_screen_on.metainfo.xml"
icon = ["assets/icon.png"]
resources = []
category = "Utility"
short_description = "A small utility for keeping the screen on"
long_description = "A small utility for keeping the screen on"

[features]
default = ["csd"]
csd = ["dep:egui_material_icons", "dep:winit"]

[dependencies]
anyhow = "1.0.104"
display-info = "0.5.10"
eframe = "0.37.0"
egui = "0.37.0"
egui_material_icons = { version = "0.9.0", features = ["compressed"], optional = true }
winit = { version = "0.30.13", optional = true }
screen_control_library = { version = "1.0.0", path = "../keep_screen_on_lib" }

[build-dependencies]
winresource = "0.1"
ico = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
